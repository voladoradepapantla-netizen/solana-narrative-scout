name: Refresh live narrative scout data

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-data.mjs"
      - "package.json"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh from public Solana, GitHub, and RPC sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the public scout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate from live sources only
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STRICT_LIVE: "1"
      - name: Publish refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narratives.js data/narratives.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh live narrative snapshot"
            git push
          fi
